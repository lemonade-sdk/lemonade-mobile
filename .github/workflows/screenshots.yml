name: Store Screenshots

# Build once per platform, then fan out to one Maestro screenshot job
# per device profile. The screenshot jobs are pure
# "install-app-and-tap-around" and re-use the artifact produced by
# the build job — way faster (and cheaper, especially on macOS-14
# runners) than running `flutter build` 7 separate times.
#
# Triggers:
#   • tag push (`v*`) — your "ship a release" moment
#   • workflow_dispatch — the "Run workflow" button
#
# Outputs: one PNG-only artifact per (platform, device). Each PNG is
# at the simulator/emulator's native resolution → drop straight into
# App Store Connect / Play Console.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Single-shot builds. Producer jobs for the screenshot matrices.
  # ──────────────────────────────────────────────────────────────────

  build-android:
    name: Build · Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
          if-no-files-found: error

  build-ios:
    name: Build · iOS simulator app
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Disable Flutter SPM (force CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - run: flutter pub get

      - name: Codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build ios --simulator --debug --no-codesign

      - name: Locate built .app
        id: locate
        run: |
          APP=$(find build/ios/iphonesimulator -name "*.app" -type d | head -n1)
          if [ -z "$APP" ]; then
            echo "No .app found under build/ios/iphonesimulator" >&2
            exit 1
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Upload .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-app
          # actions/upload-artifact handles directories transparently
          # (zips them on the way up, unzips on download).
          path: ${{ steps.locate.outputs.app }}
          retention-days: 1
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # Screenshot fan-out. One job per device profile per platform.
  # ──────────────────────────────────────────────────────────────────

  ios:
    name: iOS · ${{ matrix.device.label }}
    needs: build-ios
    runs-on: macos-14
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        device:
          - { id: "iPhone 15 Pro Max",                       label: "iphone-6.5"  }
          # 8 Plus was dropped from current Xcode simulators — SE 3rd
          # gen is the small iPhone Apple still ships, and the App
          # Store accepts 6.5" screenshots in the 5.5" slot anyway.
          - { id: "iPhone SE (3rd generation)",              label: "iphone-se"   }
          - { id: "iPad Pro (12.9-inch) (6th generation)",   label: "ipad-12.9"   }
          - { id: "iPad Pro (11-inch) (4th generation)",     label: "ipad-11"     }
    steps:
      - uses: actions/checkout@v4

      - name: Download .app bundle
        uses: actions/download-artifact@v4
        with:
          name: ios-sim-app
          path: app-bundle

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r --arg n "${{ matrix.device.id }}" '.devices | to_entries | map(.value[] | select(.name == $n)) | .[0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No available simulator named '${{ matrix.device.id }}' — listing what we have:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Install app
        run: |
          APP=$(find app-bundle -maxdepth 4 -name "*.app" -type d | head -n1)
          if [ -z "$APP" ]; then
            echo "No .app inside the downloaded artifact:" >&2
            find app-bundle | head >&2
            exit 1
          fi
          xcrun simctl install "$UDID" "$APP"

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flow
        run: |
          mkdir -p out/${{ matrix.device.label }}
          maestro --udid "$UDID" test .maestro/screenshots.yaml \
            -e APP_ID=lemonade.mobile \
            --debug-output out/${{ matrix.device.label }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.device.label }}
          path: out/${{ matrix.device.label }}/**/*.png

  android:
    name: Android · ${{ matrix.device.label }}
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device:
          - { profile: "pixel_7",  api: 34, label: "phone"      }
          - { profile: "Nexus 7",  api: 34, label: "tablet-7"   }
          - { profile: "Nexus 10", api: 34, label: "tablet-10"  }
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM (faster emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk

      - name: Run emulator + Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.device.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device.profile }}
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r apk/app-debug.apk
            curl -fsSL https://get.maestro.mobile.dev | bash
            export PATH="$HOME/.maestro/bin:$PATH"
            mkdir -p out/${{ matrix.device.label }}
            maestro test .maestro/screenshots.yaml \
              -e APP_ID=com.lemonade.mobile.chat.ai \
              --debug-output out/${{ matrix.device.label }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.device.label }}
          path: out/${{ matrix.device.label }}/**/*.png
