# Maestro screenshot flow for App Store / Play Store submissions.
#
# `takeScreenshot: <name>` writes `<name>.png` to Maestro's current
# working directory. The CI workflow `cd`s into out/<device>/ first,
# so this flow just produces files named per screen — the directory
# layout is handled outside.
#
# Server-data caveat: many screens look much better with a connected
# Lemonade server (models populated, admin console dashboards
# showing real data). Without one, what reviewers see is the
# empty-state version. Both still ship — empty states are what a
# new user experiences anyway.

appId: ${APP_ID}
---
# 01 — Empty Chat
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 01_chat_empty

# 02 — Drawer open
- tapOn:
    id: "menu_button"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 02_drawer

# 03 — Model defaults (in the drawer's lower section)
- tapOn:
    text: "Model defaults"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible: "Model defaults"
    commands:
      - takeScreenshot: 03_model_defaults
      - back

# 04 — Transcription tool (from drawer)
- tapOn:
    id: "menu_button"
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    text: "Transcription"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible: "Transcription"
    commands:
      - takeScreenshot: 04_transcription
      - back

# 05 — Settings
- tapOn:
    id: "menu_button"
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    text: "Settings"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
# 05 — Settings screenshot
- takeScreenshot: 05_settings

# 06 — Servers screen (from Settings → Manage servers)
- tapOn:
    text: "Manage servers"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible: "Manage servers"
    commands:
      - takeScreenshot: 06_servers
      - back

# 07 — Lemonade Omni
- tapOn:
    text: "Lemonade Omni"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible: "Lemonade Omni"
    commands:
      - takeScreenshot: 07_omni_router
      - back

# 08 — Settings with Admin Mode enabled (reveals "Open Admin Console")
- tapOn:
    text: "Admin Mode"
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: 08_settings_admin_on

# 09–13 — Admin Console tabs
- tapOn:
    text: "Open Admin Console"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000

# Dashboard is the default tab on entry.
- runFlow:
    when:
      visible: "Dashboard"
    commands:
      - takeScreenshot: 09_admin_dashboard
      - tapOn:
          text: "Models"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
      - takeScreenshot: 10_admin_models
      - tapOn:
          text: "Backends"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
      - takeScreenshot: 11_admin_backends
      - tapOn:
          text: "System"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
      - takeScreenshot: 12_admin_system
      - tapOn:
          text: "Logs"
          optional: true
      - waitForAnimationToEnd:
          timeout: 1500
      - takeScreenshot: 13_admin_logs
      - back

# Pop Settings to return to chat for the next capture.
- back

# 14 — Talk screen (full-screen voice call UI)
- tapOn:
    id: "talk_button"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Talk"
    commands:
      - takeScreenshot: 14_talk_screen
      - back
